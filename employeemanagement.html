<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        input, select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .add {
            background: #333;
            color: white;
        }

        .cancel {
            background: #777;
            color: white;
            display: none;
        }

        .search {
            width: 100%;
            margin: 15px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #333;
            color: white;
        }

        .edit {
            background: #555;
            color: white;
            padding: 7px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .delete {
            background: #c62828;
            color: white;
            padding: 7px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .message {
            text-align: center;
            margin: 10px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .form {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 12px;
            }

            .container {
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Employee Management System</h1>

    <!-- Employee Form -->
    <div class="form">

        <input type="hidden" id="employeeId">

        <input
            type="text"
            id="name"
            placeholder="Employee Name"
        >

        <input
            type="text"
            id="department"
            placeholder="Department"
        >

        <input
            type="text"
            id="designation"
            placeholder="Designation"
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <input
            type="tel"
            id="phone"
            placeholder="Phone Number"
        >

        <input
            type="number"
            id="salary"
            placeholder="Salary"
        >

        <input
            type="date"
            id="joiningDate"
        >

        <button
            class="btn add"
            onclick="saveEmployee()"
            id="saveButton"
        >
            Add Employee
        </button>

        <button
            class="btn cancel"
            onclick="cancelEdit()"
            id="cancelButton"
        >
            Cancel
        </button>

    </div>

    <div class="message" id="message"></div>

    <!-- Search -->
    <input
        type="text"
        class="search"
        id="search"
        placeholder="Search by name or department..."
        onkeyup="searchEmployee()"
    >

    <!-- Employee Table -->
    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Department</th>
                <th>Designation</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Salary</th>
                <th>Joining Date</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="employeeTable">
        </tbody>

    </table>

</div>


<script>

    // Employee data
    let employees = JSON.parse(
        localStorage.getItem("employees")
    ) || [];

    let editId = null;


    // Save employee
    function saveEmployee() {

        const name =
            document.getElementById("name").value.trim();

        const department =
            document.getElementById("department").value.trim();

        const designation =
            document.getElementById("designation").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const phone =
            document.getElementById("phone").value.trim();

        const salary =
            document.getElementById("salary").value;

        const joiningDate =
            document.getElementById("joiningDate").value;


        // Validation
        if (
            !name ||
            !department ||
            !designation ||
            !email ||
            !phone ||
            !salary ||
            !joiningDate
        ) {

            showMessage(
                "Please fill all fields",
                "red"
            );

            return;
        }


        // Email validation
        const emailPattern =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailPattern.test(email)) {

            showMessage(
                "Please enter a valid email",
                "red"
            );

            return;
        }


        // Phone validation
        if (!/^[0-9]{10}$/.test(phone)) {

            showMessage(
                "Phone number must contain 10 digits",
                "red"
            );

            return;
        }


        // Employee object
        const employee = {

            id: editId || Date.now(),

            name: name,

            department: department,

            designation: designation,

            email: email,

            phone: phone,

            salary: salary,

            joiningDate: joiningDate
        };


        // UPDATE
        if (editId) {

            const index =
                employees.findIndex(
                    e => e.id === editId
                );

            employees[index] = employee;

            showMessage(
                "Employee updated successfully!",
                "green"
            );

        }

        // CREATE
        else {

            employees.push(employee);

            showMessage(
                "Employee added successfully!",
                "green"
            );
        }


        // Save to browser storage
        localStorage.setItem(
            "employees",
            JSON.stringify(employees)
        );


        clearForm();

        displayEmployees(employees);
    }


    // READ
    function displayEmployees(data) {

        const table =
            document.getElementById(
                "employeeTable"
            );

        table.innerHTML = "";


        if (data.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="9">
                        No employees found
                    </td>
                </tr>
            `;

            return;
        }


        data.forEach(employee => {

            table.innerHTML += `

                <tr>

                    <td>${employee.id}</td>

                    <td>${employee.name}</td>

                    <td>${employee.department}</td>

                    <td>${employee.designation}</td>

                    <td>${employee.email}</td>

                    <td>${employee.phone}</td>

                    <td>₹${employee.salary}</td>

                    <td>${employee.joiningDate}</td>

                    <td>

                        <button
                            class="edit"
                            onclick="editEmployee(${employee.id})"
                        >
                            Edit
                        </button>

                        <button
                            class="delete"
                            onclick="deleteEmployee(${employee.id})"
                        >
                            Delete
                        </button>

                    </td>

                </tr>
            `;
        });
    }


    // EDIT
    function editEmployee(id) {

        const employee =
            employees.find(
                e => e.id === id
            );

        if (!employee) return;


        editId = id;


        document.getElementById(
            "name"
        ).value = employee.name;


        document.getElementById(
            "department"
        ).value = employee.department;


        document.getElementById(
            "designation"
        ).value = employee.designation;


        document.getElementById(
            "email"
        ).value = employee.email;


        document.getElementById(
            "phone"
        ).value = employee.phone;


        document.getElementById(
            "salary"
        ).value = employee.salary;


        document.getElementById(
            "joiningDate"
        ).value = employee.joiningDate;


        document.getElementById(
            "saveButton"
        ).textContent = "Update Employee";


        document.getElementById(
            "cancelButton"
        ).style.display = "block";
    }


    // DELETE
    function deleteEmployee(id) {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this employee?"
            );


        if (!confirmDelete) return;


        employees =
            employees.filter(
                e => e.id !== id
            );


        localStorage.setItem(
            "employees",
            JSON.stringify(employees)
        );


        displayEmployees(employees);


        showMessage(
            "Employee deleted successfully!",
            "green"
        );
    }


    // SEARCH
    function searchEmployee() {

        const search =
            document.getElementById(
                "search"
            ).value.toLowerCase();


        const result =
            employees.filter(employee =>

                employee.name
                    .toLowerCase()
                    .includes(search)

                ||

                employee.department
                    .toLowerCase()
                    .includes(search)

                ||

                employee.designation
                    .toLowerCase()
                    .includes(search)
            );


        displayEmployees(result);
    }


    // Clear form
    function clearForm() {

        document.getElementById(
            "name"
        ).value = "";

        document.getElementById(
            "department"
        ).value = "";

        document.getElementById(
            "designation"
        ).value = "";

        document.getElementById(
            "email"
        ).value = "";

        document.getElementById(
            "phone"
        ).value = "";

        document.getElementById(
            "salary"
        ).value = "";

        document.getElementById(
            "joiningDate"
        ).value = "";

        editId = null;


        document.getElementById(
            "saveButton"
        ).textContent = "Add Employee";


        document.getElementById(
            "cancelButton"
        ).style.display = "none";
    }


    // Cancel edit
    function cancelEdit() {

        clearForm();

        showMessage(
            "Edit cancelled",
            "black"
        );
    }


    // Message
    function showMessage(text, color) {

        const message =
            document.getElementById(
                "message"
            );

        message.textContent = text;

        message.style.color = color;


        setTimeout(() => {

            message.textContent = "";

        }, 3000);
    }


    // Load employees when page opens
    displayEmployees(employees);

</script>

</body>
</html>
